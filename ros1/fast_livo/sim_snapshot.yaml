# Simulation-only XYZ snapshots; calibrated_exec reads actual RGB CameraInfo
# and static LiDAR/IMU/color-optical TF before starting the mapping executable.
common:
  img_topic: /camera/color/image_raw
  lid_topic: /livox/lidar
  imu_topic: /livox/imu
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false
calibration:
  camera_info_topic: /camera/color/camera_info
  lidar_frame: mid360_link
  imu_frame: mid360_imu_link
  timeout_wall: 45.0
time_offset:
  imu_time_offset: 0.0
  img_time_offset: 0.0
  lidar_time_offset: 0.0
  exposure_time_init: 0.0
preprocess:
  lidar_type: 8
  point_filter_num: 1
  filter_size_surf: 0.15
  scan_line: 1
  blind: 0.8
  feature_extract_enabled: false
vio:
  max_iterations: 5
  outlier_threshold: 1000.0
  img_point_cov: 100.0
  patch_size: 8
  patch_pyrimid_level: 3
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: false
  inv_expo_cov: 0.1
imu:
  imu_en: true
  imu_int_frame: 20
  gravity_est_en: true
  ba_bg_est_en: true
  acc_cov: 0.1
  gyr_cov: 0.1
lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]
local_map:
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8
uav:
  imu_rate_odom: false
  gravity_align_en: true
publish:
  map_frame: livo_map
  imu_frame: mid360_imu_link
  tf_en: false
  dense_map_en: true
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0
evo:
  seq_name: aliengo_sim
  pose_output_en: false
pcd_save:
  pcd_save_en: true
  type: 0
  colmap_output_en: false
  filter_size_pcd: 0.15
  interval: -1
image_save:
  img_save_en: false
  interval: 1
