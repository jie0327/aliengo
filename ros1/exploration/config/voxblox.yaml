# Native sensor frames retain independent ray origins in one TSDF.
world_frame: lio_map
use_tf_transforms: true
use_freespace_pointcloud: false
tsdf_voxel_size: 0.1
tsdf_voxels_per_side: 16
min_ray_length_m: 0.15
max_ray_length_m: 10
truncation_distance: 0.3
voxel_carving_enabled: true
method: merged
integration_order_mode: sorted
pointcloud_queue_size: 30
min_time_between_msgs_sec: 0.0
timestamp_tolerance_sec: 0.01
enable_icp: false
color_mode: intensity
publish_pointclouds: true
publish_tsdf_map: true
publish_esdf_map: true
publish_slices: false
publish_traversable: false
update_mesh_every_n_sec: 5
publish_map_every_n_sec: 1
esdf_max_distance_m: 2.0
clear_sphere_for_planning: false
allow_clear: false
use_const_weight: false
use_weight_dropoff: true
use_symmetric_weight_drop_off: false
max_weight: 50.0
occupancy_distance_voxelsize_factor: 0.5
sensor_frame: ''
